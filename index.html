<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kesar Apps — maker of Ludo SudoX. Legal and support pages.">
<title>Kesar Apps</title>
<style>
  :root{
    --brand:#3E2510; --brand-2:#5a3a1a; --gold:#C9A227; --gold-line:#e3c878;
    --ink:#241d15; --muted:#6f6150; --link:#8a5a14; --rule:#ece2d0;
    --card:#ffffff; --page-bg:#f1e9da;
  }
  *{box-sizing:border-box}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--page-bg);line-height:1.6;font-size:17px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:48px 16px}
  .card{
    background:var(--card);border:1px solid var(--rule);border-radius:16px;
    overflow:hidden;box-shadow:0 10px 30px rgba(62,37,16,.10);
  }
  header.hero{
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    color:#f6ecd8;padding:40px 32px 32px;border-bottom:4px solid var(--gold);
  }
  header.hero h1{margin:0 0 6px;font-size:30px;color:#fff}
  header.hero p{margin:0;color:#e7d6b3;font-size:15px}
  main{padding:28px 32px 36px}
  h2{font-size:18px;color:var(--brand);margin:0 0 14px}
  h2 ~ h2{margin-top:26px}
  ul{list-style:none;margin:0;padding:0}
  li{margin:10px 0}
  a{
    color:var(--link);text-decoration:none;font-weight:600;
    display:inline-flex;align-items:center;gap:8px;
  }
  a:hover{color:var(--brand);text-decoration:underline}
  footer{padding:18px 32px 28px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--rule)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header class="hero">
        <h1>Kesar Apps</h1>
        <p>Maker of Ludo SudoX</p>
      </header>
      <main>
        <h2>Our Apps</h2>
        <ul>
          <li><a href="https://play.google.com/store/apps/details?id=com.kesarapps.ludosudox">→ Ludo SudoX: Casual Board Game (Google Play)</a></li>
        </ul>
        <h2>Legal &amp; Support</h2>
        <ul>
          <li><a href="./privacy_policy.html">→ Privacy Policy (Ludo SudoX)</a></li>
          <li><a href="mailto:parulpeljnd123@gmail.com">→ Contact support</a></li>
        </ul>
      </main>
      <footer>© 2026 Kesar Apps. All rights reserved.</footer>
    </div>
  </div>
</body>
</html>
